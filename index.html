<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>diorepo — deftio Project Dashboard</title>
<style>
:root {
  --bg: #ffffff;
  --bg-alt: #f8f9fa;
  --bg-panel: #f1f3f5;
  --text: #212529;
  --text-muted: #6c757d;
  --border: #dee2e6;
  --accent: #0066cc;
  --accent-hover: #0052a3;
  --green: #28a745;
  --yellow: #ffc107;
  --red: #dc3545;
  --shadow: 0 2px 8px rgba(0,0,0,0.08);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1a1a2e;
    --bg-alt: #16213e;
    --bg-panel: #0f3460;
    --text: #e0e0e0;
    --text-muted: #a0a0a0;
    --border: #333;
    --accent: #4da6ff;
    --accent-hover: #80bfff;
    --shadow: 0 2px 8px rgba(0,0,0,0.3);
  }
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.5;
  padding: 20px;
}
h1 {
  font-size: 1.8rem;
  margin-bottom: 4px;
}
.subtitle {
  color: var(--text-muted);
  margin-bottom: 20px;
  font-size: 0.95rem;
}
.toolbar {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  align-items: center;
  margin-bottom: 16px;
}
.toolbar input[type="text"] {
  padding: 8px 12px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--bg-alt);
  color: var(--text);
  font-size: 0.9rem;
  min-width: 240px;
}
.toolbar button {
  padding: 8px 14px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--bg-alt);
  color: var(--text);
  cursor: pointer;
  font-size: 0.85rem;
  transition: background 0.2s;
}
.toolbar button:hover {
  background: var(--accent);
  color: #fff;
  border-color: var(--accent);
}
.table-wrap {
  overflow-x: auto;
  border-radius: 8px;
  box-shadow: var(--shadow);
  border: 1px solid var(--border);
}
table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.88rem;
  white-space: nowrap;
}
thead th {
  background: var(--bg-alt);
  padding: 10px 12px;
  text-align: left;
  cursor: pointer;
  user-select: none;
  position: sticky;
  top: 0;
  border-bottom: 2px solid var(--border);
  font-weight: 600;
}
thead th:hover { color: var(--accent); }
thead th .sort-arrow { margin-left: 4px; font-size: 0.7rem; }
tbody tr {
  cursor: pointer;
  transition: background 0.15s;
}
tbody tr:nth-child(even) { background: var(--bg-alt); }
tbody tr:hover { background: var(--bg-panel); }
tbody td {
  padding: 8px 12px;
  border-bottom: 1px solid var(--border);
}
.issue-green { color: var(--green); font-weight: 600; }
.issue-yellow { color: var(--yellow); font-weight: 600; }
.issue-red { color: var(--red); font-weight: 600; }
.spinner {
  display: inline-block;
  width: 14px;
  height: 14px;
  border: 2px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.6s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.detail-row { display: none; }
.detail-row.open { display: table-row; }
.detail-row td {
  padding: 16px 20px;
  background: var(--bg-panel);
  border-bottom: 2px solid var(--border);
}
.detail-content {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
  white-space: normal;
}
.detail-content h3 { margin-bottom: 6px; font-size: 1rem; }
.detail-content ul { list-style: none; padding: 0; }
.detail-content ul li { padding: 3px 0; font-size: 0.85rem; }
.detail-content a { color: var(--accent); text-decoration: none; }
.detail-content a:hover { text-decoration: underline; }
.status-bar {
  margin-top: 12px;
  font-size: 0.82rem;
  color: var(--text-muted);
}
.status-bar code {
  background: var(--bg-alt);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 1px 5px;
  font-size: 0.95em;
}
.stale { color: var(--yellow); font-weight: 600; }
@media (max-width: 768px) {
  .detail-content { grid-template-columns: 1fr; }
  .toolbar { flex-direction: column; align-items: stretch; }
  .toolbar input[type="text"] { min-width: auto; }
}
</style>
</head>
<body>
<h1>diorepo</h1>
<p class="subtitle">Cross-repo dashboard for <a href="https://github.com/deftio" style="color:var(--accent)">deftio</a> open-source projects</p>

<div class="toolbar">
  <input type="text" id="filterInput" placeholder="Filter projects..." />
  <button onclick="exportCSV()">Export CSV</button>
  <button onclick="exportJSON()">Export JSON</button>
  <button onclick="exportMD()">Export Markdown</button>
</div>

<div class="table-wrap">
  <table id="mainTable">
    <thead>
      <tr>
        <th data-col="project">Project <span class="sort-arrow"></span></th>
        <th data-col="stars">Stars <span class="sort-arrow"></span></th>
        <th data-col="contributors">Contributors <span class="sort-arrow"></span></th>
        <th data-col="open_issues">Open Issues <span class="sort-arrow"></span></th>
        <th data-col="total_issues">Total Issues <span class="sort-arrow"></span></th>
        <th data-col="downloads">Downloads <span class="sort-arrow"></span></th>
        <th data-col="npm">npm <span class="sort-arrow"></span></th>
        <th data-col="pypi">PyPI <span class="sort-arrow"></span></th>
        <th data-col="arduino">Arduino <span class="sort-arrow"></span></th>
        <th data-col="platformio">PlatformIO <span class="sort-arrow"></span></th>
        <th data-col="espressif">Espressif <span class="sort-arrow"></span></th>
        <th data-col="github_tag">GitHub Tag <span class="sort-arrow"></span></th>
      </tr>
    </thead>
    <tbody id="tableBody"></tbody>
  </table>
</div>

<div class="status-bar" id="statusBar">Loading...</div>

<script>
// The dashboard renders from data.json, a snapshot produced by diorepo.js and
// refreshed by CI. It makes no API calls of its own: GitHub allows anonymous
// callers only 60 requests/hour (and far fewer against the issue-search
// endpoint), which a live-fetching page burned through on a single load.
//
// To refresh by hand:  node diorepo.js --format json --output data.json

const DATA_URL = 'data.json';
const STALE_AFTER_DAYS = 10;

let projectData = [];
let generatedAt = null;
let sortCol = 'project';
let sortAsc = true;

// Helpers
function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function issueClass(n) {
  if (n === null || n === undefined) return '';
  if (n === 0) return 'issue-green';
  if (n <= 5) return 'issue-yellow';
  return 'issue-red';
}

function cell(val, cls) {
  if (val === null || val === undefined || val === '') return '—';
  const c = cls ? ` class="${cls}"` : '';
  return `<span${c}>${esc(val)}</span>`;
}

function cellDownloads(p) {
  if (!p.downloads || p.downloads === '—') return '—';
  const parts = [];
  if (p.npm_downloads) parts.push(`npm: ${p.npm_downloads.toLocaleString()}`);
  if (p.pypi_downloads) parts.push(`PyPI: ${p.pypi_downloads.toLocaleString()}`);
  const total = typeof p.downloads === 'number' ? p.downloads.toLocaleString() : p.downloads;
  return `<span title="${esc(parts.join(', '))}">${esc(total)}</span>`;
}

// Rendering
function renderTable() {
  const filter = document.getElementById('filterInput').value.toLowerCase();
  const data = projectData
    .filter(p => p.project.toLowerCase().includes(filter))
    .slice()
    .sort((a, b) => {
      let av = a[sortCol], bv = b[sortCol];
      // Missing values sort last regardless of direction.
      if (av === null || av === undefined || av === '—') av = sortAsc ? Infinity : -Infinity;
      if (bv === null || bv === undefined || bv === '—') bv = sortAsc ? Infinity : -Infinity;
      if (typeof av === 'string') av = av.toLowerCase();
      if (typeof bv === 'string') bv = bv.toLowerCase();
      if (av < bv) return sortAsc ? -1 : 1;
      if (av > bv) return sortAsc ? 1 : -1;
      return 0;
    });

  const tbody = document.getElementById('tableBody');
  tbody.innerHTML = data.map(p => `
    <tr data-project="${esc(p.project)}">
      <td><a href="https://github.com/${esc(p.github)}" target="_blank" rel="noopener">${esc(p.project)}</a></td>
      <td>${cell(p.stars)}</td>
      <td>${cell(p.contributors)}</td>
      <td>${cell(p.open_issues, issueClass(p.open_issues))}</td>
      <td>${cell(p.total_issues)}</td>
      <td>${cellDownloads(p)}</td>
      <td>${cell(p.npm)}</td>
      <td>${cell(p.pypi)}</td>
      <td>${cell(p.arduino)}</td>
      <td>${cell(p.platformio)}</td>
      <td>${cell(p.espressif)}</td>
      <td>${cell(p.github_tag)}</td>
    </tr>
    <tr class="detail-row${p._open ? ' open' : ''}" data-detail="${esc(p.project)}">
      <td colspan="12">
        <div class="detail-content">
          <div>
            <h3>${esc(p.project)}</h3>
            <p>${esc(p.description) || 'No description'}</p>
            <p style="color:var(--text-muted)">Language: ${esc(p.language) || '—'}</p>
            <h3 style="margin-top:12px">Registry Links</h3>
            <ul>${renderLinks(p)}</ul>
          </div>
          <div>
            <h3>Recent Releases</h3>
            <ul>${renderReleases(p)}</ul>
            <h3 style="margin-top:12px">Open Issues</h3>
            <ul>${renderIssues(p)}</ul>
          </div>
        </div>
      </td>
    </tr>
  `).join('');

  document.querySelectorAll('thead th').forEach(th => {
    th.querySelector('.sort-arrow').textContent =
      th.dataset.col === sortCol ? (sortAsc ? '▲' : '▼') : '';
  });
}

function renderLinks(p) {
  const pkgs = p.packages || {};
  const links = [`<li><a href="https://github.com/${esc(p.github)}" target="_blank" rel="noopener">GitHub</a></li>`];
  if (pkgs.npm) links.push(`<li><a href="https://www.npmjs.com/package/${esc(pkgs.npm)}" target="_blank" rel="noopener">npm</a></li>`);
  if (pkgs.pypi) links.push(`<li><a href="https://pypi.org/project/${esc(pkgs.pypi)}" target="_blank" rel="noopener">PyPI</a></li>`);
  if (pkgs.platformio) links.push(`<li><a href="https://registry.platformio.org/libraries/${esc(p.github.split('/')[0])}/${esc(pkgs.platformio)}" target="_blank" rel="noopener">PlatformIO</a></li>`);
  if (pkgs.espressif) links.push(`<li><a href="https://components.espressif.com/components/${esc(p.github.split('/')[0])}/${esc(pkgs.espressif)}" target="_blank" rel="noopener">Espressif</a></li>`);
  return links.join('');
}

function renderReleases(p) {
  const rels = p.releases || [];
  if (rels.length === 0) return '<li>No releases</li>';
  return rels.slice(0, 5).map(r =>
    `<li><a href="${esc(r.html_url)}" target="_blank" rel="noopener">${esc(r.tag_name)}</a> — ${r.published_at ? esc(new Date(r.published_at).toLocaleDateString()) : '—'}</li>`
  ).join('');
}

function renderIssues(p) {
  const issues = p.recent_issues || [];
  if (issues.length === 0) return '<li>No open issues</li>';
  return issues.slice(0, 5).map(i =>
    `<li><a href="${esc(i.html_url)}" target="_blank" rel="noopener">#${esc(i.number)}</a> ${esc(i.title)}</li>`
  ).join('');
}

// Row expand/collapse, via delegation so re-renders keep working.
document.getElementById('tableBody').addEventListener('click', (e) => {
  if (e.target.closest('a')) return;
  const row = e.target.closest('tr[data-project]');
  if (!row) return;
  const p = projectData.find(x => x.project === row.dataset.project);
  if (p) { p._open = !p._open; renderTable(); }
});

// Sort
document.querySelectorAll('thead th').forEach(th => {
  th.addEventListener('click', () => {
    const col = th.dataset.col;
    if (sortCol === col) sortAsc = !sortAsc;
    else { sortCol = col; sortAsc = true; }
    renderTable();
  });
});

// Filter
document.getElementById('filterInput').addEventListener('input', renderTable);

// Export functions
const EXPORT_COLS = [
  ['project', 'project'], ['stars', 'stars'], ['contributors', 'contributors'],
  ['open_issues', 'open_issues'], ['total_issues', 'total_issues'],
  ['downloads', 'downloads'], ['npm', 'npm'], ['pypi', 'pypi'],
  ['arduino', 'arduino'], ['platformio', 'platformio'],
  ['espressif', 'espressif'], ['github_tag', 'github_tag'],
];

function getExportData() {
  return projectData.map(p => {
    const row = {};
    for (const [label, key] of EXPORT_COLS) row[label] = p[key] ?? '';
    return row;
  });
}

// RFC 4180: wrap in quotes, escape embedded quotes by doubling them.
function csvCell(value) {
  return `"${String(value).replace(/"/g, '""')}"`;
}

function exportCSV() {
  const data = getExportData();
  if (!data.length) return;
  const headers = Object.keys(data[0]);
  const csv = [headers.join(','), ...data.map(row => headers.map(h => csvCell(row[h])).join(','))].join('\n');
  download('diorepo.csv', csv, 'text/csv');
}

function exportJSON() {
  download('diorepo.json', JSON.stringify(getExportData(), null, 2), 'application/json');
}

function exportMD() {
  const data = getExportData();
  if (!data.length) return;
  const headers = Object.keys(data[0]);
  const md = [
    '| ' + headers.join(' | ') + ' |',
    '| ' + headers.map(() => '---').join(' | ') + ' |',
    ...data.map(row => '| ' + headers.map(h => row[h]).join(' | ') + ' |')
  ].join('\n');
  download('diorepo.md', md, 'text/markdown');
}

function download(filename, content, type) {
  const blob = new Blob([content], { type });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function setStatus(html) {
  document.getElementById('statusBar').innerHTML = html;
}

function ageInDays(iso) {
  return (Date.now() - new Date(iso).getTime()) / 86400000;
}

// Init
async function init() {
  setStatus('Loading data.json…');
  let payload;
  try {
    const resp = await fetch(DATA_URL, { cache: 'no-cache' });
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    payload = await resp.json();
  } catch (err) {
    setStatus(`Could not load <code>data.json</code> (${esc(err.message)}). Generate it with <code>node diorepo.js --format json --output data.json</code>.`);
    return;
  }

  projectData = payload.projects || [];
  generatedAt = payload.generated || null;
  renderTable();

  const parts = [`${projectData.length} projects`];
  if (generatedAt) {
    const days = ageInDays(generatedAt);
    const when = `data generated ${esc(new Date(generatedAt).toLocaleString())}`;
    parts.push(days > STALE_AFTER_DAYS
      ? `<span class="stale">${when} (${Math.floor(days)} days old)</span>`
      : when);
  }
  setStatus(parts.join(' · '));
}

init();

</script>
</body>
</html>
